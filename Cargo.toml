[workspace]
members = ["crates/ludo-core", "crates/ludo-registry", "crates/ludo-cli", "crates/ludo-wasm", "games/yavalath", "games/riichi", "games/pairs", "games/cards", "games/pennywise", "games/bantu", "games/monad", "games/volltreffer", "games/black-vienna", "games/cryptide", "games/black-pot", "games/manoever", "games/siberian-dice", "games/black-hole", "games/corporation", "games/twixt", "games/tigre-euphrate"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ludo-core = { path = "crates/ludo-core" }
yavalath = { path = "games/yavalath" }
bantu = { path = "games/bantu" }
riichi = { path = "games/riichi" }
pairs = { path = "games/pairs" }
cards = { path = "games/cards" }
pennywise = { path = "games/pennywise" }
monad = { path = "games/monad" }
volltreffer = { path = "games/volltreffer" }
black-vienna = { path = "games/black-vienna" }
cryptide = { path = "games/cryptide" }
black-pot = { path = "games/black-pot" }
siberian-dice = { path = "games/siberian-dice" }
black-hole = { path = "games/black-hole" }
corporation = { path = "games/corporation" }
twixt = { path = "games/twixt" }
tigre-euphrate = { path = "games/tigre-euphrate" }
manoever = { path = "games/manoever" }
ludo-registry = { path = "crates/ludo-registry" }

[profile.release]
opt-level = 3

# WASM build: `cargo build --profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# TwixT's network: size-optimised code is several times slower.
[profile.wasm-release.package.twixt]
opt-level = 3
